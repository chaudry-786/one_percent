<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Percent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}">
  <script>document.documentElement.classList.toggle("dark", (localStorage.getItem("op-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "dark");</script>
</head>
<body class="grid min-h-screen place-items-center bg-slate-50 p-4 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <main class="max-w-md text-center">
    <h1 class="text-2xl font-bold">One Percent</h1>
    <p class="mb-6 mt-2 text-slate-500">Small habits, compounding results. Upload your Apple Health export to see how your sleep, exercise and heart are trending.</p>
    <button type="button" class="btn-primary" onclick="SleepUpload.open()">Upload export</button>
  </main>
  <script src="{{ url_for('static', filename='upload.js') }}"></script>
</body>
</html>
