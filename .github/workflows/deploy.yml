name: Deploy to Cloud Run

# The service, bucket and secrets are defined in the chaudry-786/infra repo.
# This workflow only builds the image and rolls out a new revision.
# Repository variables (Settings → Secrets and variables → Actions → Variables),
# taken from `terraform output` in the infra repo:
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGION: europe-west2
  SERVICE: one-percent

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision
        run: |
          gcloud run deploy "$SERVICE" --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet
